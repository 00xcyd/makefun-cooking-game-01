<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wok Luck — a night-market cooking rush</title>
<meta name="description" content="Wok Luck: a 90-second night-market cooking game. Read tickets, fill your bowl, chop, stir and serve.">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #041214;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 50% 40%, #0d2a2c 0%, #041214 68%);
  }
  #game {
    display: block;
    width: 1280px;
    height: 720px;
    max-width: 100vw;
    max-height: 100vh;
    border-radius: 2px;
    box-shadow: 0 0 80px rgba(0, 0, 0, 0.65);
    touch-action: none;
    outline: none;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" tabindex="0"
  aria-label="Wok Luck, a night-market cooking game: read order tickets, collect ingredients, chop, stir the wok, plate and serve before the shift clock runs out"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
